name: dashboard-updates

# ── 스케줄 설계 메모 (2026-08-31 개편) ───────────────────────────────
# GitHub의 cron(schedule)은 "정시 보장"이 아니라 최선 노력(best-effort)이라
# 수 시간 지연되거나 아예 배달되지 않는 날이 있다. 실제로 8/26~8/31 사이
# 배달률이 계속 떨어졌고 8/31(월)에는 하루 종일 0건이었다.
# 대응 두 가지:
#   1) cron 등록 수를 줄인다 (하루 13회 → 6회). 촘촘한 스케줄은 후순위로 밀린다.
#      장중 시간별 갱신은 cron 대신 "아침에 시작한 한 번의 실행이 루프를 돌며"
#      처리한다 → 아침 실행 하나만 도착하면 그날 갱신 전체가 보장된다.
#   2) 메일은 시각 고정이 아니라 창(window)으로 판정한다. 평일 CT 8:45~13:00에
#      도착한 첫 실행이 메일을 보내고 .mail_sent 마커로 하루 1회를 보장한다.
#      → 이벤트가 늦게 도착해도 "누락" 대신 "지연 발송"이 된다.
# cron은 UTC 고정이라 서머타임을 모름 → 각 줄에 DST 양쪽 후보를 넣고
# 게이트가 실제 시카고 시각으로 하나만 통과시킨다.
on:
  schedule:
    - cron: '50 13,14 * * 1-5'   # 평일 8:50 AM CT — 메일 + 그날의 장중 갱신 루프 시작
    - cron: '30 16,17 * * 1-5'   # 평일 11:30 AM CT — 아침 실행이 누락된 날의 예비 슬롯
    - cron: '15 20,21 * * 1-5'   # 평일 3:15 PM CT (16:15 ET) — 마감 후 확정 종가 스냅샷
    - cron: '0 12 * * 0,6'       # 주말 아침 1회 (BTC·뉴스 갱신, 메일 없음)
  workflow_dispatch:
    inputs:
      send_mail:
        description: '메일도 발송할지'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 358          # 장중 루프 최악 ~348분 + 여유. GitHub 작업 상한 360분 이내
    steps:
      - uses: actions/checkout@v4

      - name: Gate (시간대·요일·중복 판정)
        id: gate
        run: |
          DOW=$(TZ=America/New_York date +%u)                 # 1=월 ... 7=일
          CT_H=$(TZ=America/Chicago date +%H); CT_M=$(TZ=America/Chicago date +%M)
          CT_NOW=$((10#$CT_H * 60 + 10#$CT_M))
          TODAY_CT=$(TZ=America/Chicago date +%F)
          MAILED=0
          if [ "$(cat .mail_sent 2>/dev/null)" = "$TODAY_CT" ]; then MAILED=1; fi
          RUN=false; MAIL=false; LOOP=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true                                          # 수동 실행은 1회성 (루프 없음)
            if [ "${{ inputs.send_mail }}" = "true" ]; then MAIL=true; fi
          elif [ "$DOW" -ge 6 ]; then
            RUN=true                                          # 주말 갱신
          elif [ "$CT_NOW" -ge 480 ] && [ "$CT_NOW" -lt 870 ]; then
            # 평일 CT 8:00~14:29 = 그날의 본 작업(메일 + 장중 루프) 구간
            if [ "$MAILED" = "1" ]; then
              echo "오늘(${TODAY_CT}) 본 작업이 이미 처리됨 → 중복 실행 생략"
            else
              RUN=true; LOOP=true
              # 메일 창: CT 8:45~12:59. 늦게 도착한 실행도 그날 브리핑을 발송한다.
              if [ "$CT_NOW" -ge 525 ] && [ "$CT_NOW" -lt 780 ]; then MAIL=true; fi
            fi
          elif [ "$CT_NOW" -ge 870 ] && [ "$CT_NOW" -lt 1020 ]; then
            RUN=true                                          # CT 14:30~16:59 마감 스냅샷
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mail=$MAIL" >> "$GITHUB_OUTPUT"
          echo "loop=$LOOP" >> "$GITHUB_OUTPUT"
          echo "today_ct=$TODAY_CT" >> "$GITHUB_OUTPUT"
          echo "gate: run=$RUN mail=$MAIL loop=$LOOP (CT $CT_H:$CT_M, DOW=$DOW, mailed_today=$MAILED)"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install yfinance pandas requests tzdata

      - name: Build dashboard
        if: steps.gate.outputs.run == 'true'
        run: python market_dashboard.py -o index.html

      - name: Holiday check
        id: holiday
        if: steps.gate.outputs.run == 'true'
        run: |
          # 평일 휴장일(공휴일)이면 대시보드에 '휴장일 →' 문구가 생김 → 갱신·메일 모두 생략
          # (주말 문구 '주말 휴장 →'과 데이터 지연 문구 '데이터 지연 →'은 여기 걸리지 않음)
          if grep -q '휴장일 →' index.html; then CLOSED=true; else CLOSED=false; fi
          echo "closed=$CLOSED" >> "$GITHUB_OUTPUT"
          echo "holiday: $CLOSED"

      - name: Commit & push if changed
        if: steps.gate.outputs.run == 'true' && steps.holiday.outputs.closed != 'true'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "auto update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs
          git push

      - name: Send email notification
        if: steps.gate.outputs.mail == 'true' && steps.holiday.outputs.closed != 'true'
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_mail.py

      - name: Record mail marker
        if: steps.gate.outputs.mail == 'true' && steps.holiday.outputs.closed != 'true'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          echo "${{ steps.gate.outputs.today_ct }}" > .mail_sent
          git add .mail_sent
          git diff --cached --quiet || {
            git commit -m "mail sent ${{ steps.gate.outputs.today_ct }}"
            git pull --rebase -X theirs
            git push
          }

      - name: Intraday refresh loop (매시 30분, CT 14:30까지)
        if: steps.gate.outputs.loop == 'true' && steps.holiday.outputs.closed != 'true'
        run: |
          # cron 배달에 의존하지 않고 이 실행 하나가 장중 시간별 갱신을 모두 담당한다.
          # set -e 때문에 조건 분기는 반드시 if/then/fi 로 쓴다 ( [ ] && cmd 는 종료 유발 )
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          while true; do
            H=$(TZ=America/Chicago date +%-H); M=$(TZ=America/Chicago date +%-M)
            if [ "$M" -lt 30 ]; then
              WAIT=$(( (30 - M) * 60 )); NEXT=$(( H * 100 + 30 ))
            else
              WAIT=$(( (90 - M) * 60 )); NEXT=$(( (H + 1) * 100 + 30 ))
            fi
            if [ "$NEXT" -gt 1430 ]; then
              echo "장중 갱신 종료 (다음 슬롯 CT $NEXT 는 마감 이후)"
              break
            fi
            if [ "$SECONDS" -gt 19200 ]; then
              echo "장중 갱신 종료 (실행 시간 상한 도달 — 6시간 작업 한도 보호)"
              break
            fi
            echo "다음 갱신 CT $NEXT 까지 ${WAIT}초 대기"
            sleep "$WAIT"
            if ! python market_dashboard.py -o index.html; then
              echo "[경고] 갱신 실패 → 다음 슬롯에 재시도"
              continue
            fi
            if grep -q '휴장일 →' index.html; then
              echo "휴장일로 판정 → 루프 종료"
              break
            fi
            git add index.html
            git diff --cached --quiet || {
              git commit -m "auto update $(date -u +'%Y-%m-%d %H:%M UTC')"
              git pull --rebase -X theirs
              git push
            }
          done
