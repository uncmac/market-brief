<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="960" height="700" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">CoreCharger Mk II — 측면 개략도 (개념도 · 축척 아님)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#666">그림 시점 = 충전(FILL) 단계: 타인은 업래치에 파킹(팁이 데크 위 +140mm), 계량된 모래가 슈트→깔때기 부싱→방금 뚫은 구멍으로 낙하</text>

  <!-- soil & turf -->
  <rect x="60" y="520" width="840" height="140" fill="#b98d5e"/>
  <rect x="60" y="508" width="840" height="12" fill="#7cb35a"/>
  <line x1="60" y1="520" x2="900" y2="520" stroke="#8a6a44" stroke-width="1"/>

  <!-- previous filled hole (sand column + white dot) -->
  <rect x="292" y="510" width="16" height="100" fill="#ecd9a8" stroke="#b8a06a" stroke-width="1"/>
  <circle cx="300" cy="511" r="5" fill="#ffffff" stroke="#bbb" stroke-width="1"/>

  <!-- current hole (open, being filled) -->
  <rect x="392" y="510" width="16" height="100" fill="#42301f"/>
  <rect x="393" y="570" width="14" height="40" fill="#ecd9a8"/>

  <!-- deck (plywood + Al skin + skid lips) -->
  <rect x="300" y="494" width="300" height="14" fill="#d7c9a8" stroke="#7a6f57" stroke-width="1"/>
  <line x1="300" y1="494" x2="600" y2="494" stroke="#9aa5b1" stroke-width="3"/>
  <path d="M300,494 L290,484" stroke="#9aa5b1" stroke-width="4" fill="none"/>
  <path d="M600,494 L610,484" stroke="#9aa5b1" stroke-width="4" fill="none"/>

  <!-- pedal plate (interlock B) on deck top, front -->
  <rect x="315" y="487" width="52" height="7" rx="2" fill="#e06666" stroke="#a33" stroke-width="1"/>

  <!-- sight notch + registration dashed line to previous dot -->
  <polygon points="296,492 304,492 300,499" fill="#333"/>
  <line x1="300" y1="499" x2="300" y2="509" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- funnel bushing (flange + funnel + wiper + bore) -->
  <rect x="355" y="474" width="90" height="20" fill="#eef3f8" stroke="#6b7b8d" stroke-width="1"/>
  <polygon points="365,474 435,474 410,490 390,490" fill="#ffffff" stroke="#6b7b8d" stroke-width="1"/>
  <rect x="386" y="487" width="5" height="6" fill="#333"/>
  <rect x="409" y="487" width="5" height="6" fill="#333"/>
  <rect x="390" y="494" width="20" height="14" fill="#f7f9fb" stroke="#6b7b8d" stroke-width="1"/>
  <!-- press ring -->
  <rect x="383" y="506" width="34" height="3" fill="#c0c8d0" stroke="#8a95a1" stroke-width="0.5"/>

  <!-- mast + brace -->
  <rect x="545" y="110" width="25" height="384" fill="#97a2b0" stroke="#5f6b7a" stroke-width="1"/>
  <line x1="570" y1="440" x2="598" y2="494" stroke="#97a2b0" stroke-width="5"/>

  <!-- T-handle + brake lever -->
  <rect x="570" y="116" width="150" height="10" rx="3" fill="#6b7686"/>
  <rect x="690" y="114" width="32" height="14" rx="5" fill="#3d454f"/>
  <path d="M700,128 q10,14 26,10" stroke="#3d454f" stroke-width="3" fill="none"/>

  <!-- shaft (square) -->
  <rect x="390" y="120" width="20" height="150" fill="#aab4bf" stroke="#5f6b7a" stroke-width="1"/>
  <!-- D-grip -->
  <rect x="368" y="106" width="64" height="11" rx="5" fill="#3d454f"/>

  <!-- upper guide + up-latch -->
  <line x1="545" y1="170" x2="412" y2="170" stroke="#7a8694" stroke-width="6"/>
  <rect x="384" y="161" width="32" height="18" fill="#8b97a5" stroke="#5f6b7a" stroke-width="1"/>
  <polygon points="416,166 428,161 428,175" fill="#d9a441" stroke="#a3762a" stroke-width="1"/>

  <!-- lower guide (60mm sleeve) -->
  <line x1="545" y1="244" x2="414" y2="244" stroke="#7a8694" stroke-width="6"/>
  <rect x="384" y="226" width="32" height="38" fill="#8b97a5" stroke="#5f6b7a" stroke-width="1"/>

  <!-- stirrup (folding step, points forward/left) -->
  <rect x="298" y="300" width="94" height="8" rx="3" fill="#556270"/>
  <rect x="298" y="296" width="34" height="14" rx="4" fill="#3d454f"/>

  <!-- continuous plug tube + tine (parked, tip +140mm above deck => tip y=354) -->
  <rect x="391" y="264" width="18" height="60" fill="#cfd6dd" stroke="#5f6b7a" stroke-width="1"/>
  <rect x="404" y="270" width="6" height="24" fill="#333"/>
  <rect x="388" y="318" width="24" height="8" fill="#7a8694"/>
  <rect x="392" y="326" width="16" height="24" fill="#bfc7cf" stroke="#5f6b7a" stroke-width="1"/>
  <polygon points="392,350 408,350 400,356" fill="#5f6b7a"/>

  <!-- hopper -->
  <polygon points="480,150 600,150 570,215 510,215" fill="#f0c36a" stroke="#a3843e" stroke-width="1.5"/>
  <rect x="474" y="139" width="132" height="11" rx="3" fill="#caa14e" stroke="#a3843e" stroke-width="1"/>
  <!-- meter housing + cell wheel -->
  <rect x="505" y="215" width="70" height="66" fill="#eef0f3" stroke="#5f6b7a" stroke-width="1.5"/>
  <circle cx="540" cy="248" r="29" fill="#d9dde2" stroke="#5f6b7a" stroke-width="1.5"/>
  <circle cx="540" cy="248" r="3.5" fill="#5f6b7a"/>
  <rect x="533" y="221" width="14" height="12" fill="#f0c36a" stroke="#a3843e" stroke-width="0.8"/>
  <rect x="533" y="263" width="14" height="12" fill="#ffffff" stroke="#8a95a1" stroke-width="0.8"/>

  <!-- chute at ~60 deg with clear window -->
  <polygon points="508,278 524,286 433,428 417,420" fill="#cfd8df" stroke="#5f6b7a" stroke-width="1.5"/>
  <polygon points="479,325 495,333 469,374 453,366" fill="#bfe3f2" stroke="#4d8aa8" stroke-width="1"/>

  <!-- sand stream -->
  <path d="M424,426 Q412,455 400,478 L400,568" stroke="#d4a017" stroke-width="3" fill="none" stroke-dasharray="4,5"/>

  <!-- deflector + plug tray + plug path -->
  <line x1="512" y1="416" x2="556" y2="462" stroke="#9fb8aa" stroke-width="7"/>
  <rect x="606" y="460" width="70" height="48" fill="#c9b18a" stroke="#8a744d" stroke-width="1.5"/>
  <rect x="612" y="466" width="58" height="42" fill="#e7dcc4"/>
  <ellipse cx="630" cy="480" rx="9" ry="4" fill="#8a6a44"/>
  <ellipse cx="650" cy="490" rx="9" ry="4" fill="#8a6a44"/>
  <path d="M412,330 Q470,360 516,420 Q545,455 606,470" stroke="#8a6a44" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a6a44"/>
    </marker>
  </defs>

  <!-- ===================== labels ===================== -->
  <g font-size="12.5" fill="#333">
    <!-- left column -->
    <text x="66" y="112" text-anchor="start">D-그립(양손 인발)</text>
    <line x1="180" y1="108" x2="366" y2="110" stroke="#999" stroke-width="0.8"/>
    <text x="66" y="146" text-anchor="start">각형 샤프트 20×20mm (회전 방지 키)</text>
    <line x1="290" y1="142" x2="389" y2="140" stroke="#999" stroke-width="0.8"/>
    <text x="66" y="172" text-anchor="start">상부 가이드 + 업래치(파킹/인터록 A)</text>
    <line x1="300" y1="168" x2="383" y2="168" stroke="#999" stroke-width="0.8"/>
    <text x="66" y="240" text-anchor="start">하부 가이드(60mm 슬리브, UHMW)</text>
    <line x1="284" y1="236" x2="383" y2="240" stroke="#999" stroke-width="0.8"/>
    <text x="66" y="285" text-anchor="start">연속 플러그 튜브 17mm ID</text>
    <text x="66" y="301" text-anchor="start">+ 측면 배출창(하단=팁 위 160mm)</text>
    <line x1="238" y1="288" x2="389" y2="282" stroke="#999" stroke-width="0.8"/>
    <text x="66" y="330" text-anchor="start">접이식 발판(스터럽)</text>
    <line x1="188" y1="326" x2="296" y2="306" stroke="#999" stroke-width="0.8"/>
    <text x="66" y="360" text-anchor="start">중공 타인 16mm ID (시판 교체품, 클램프+롤핀)</text>
    <line x1="336" y1="356" x2="391" y2="342" stroke="#999" stroke-width="0.8"/>
    <text x="66" y="452" text-anchor="start">깔때기 부싱(HDPE, 엄지나사 교체)</text>
    <text x="66" y="468" text-anchor="start">+ EPDM 와이퍼(목부 함몰 장착)</text>
    <line x1="264" y1="458" x2="357" y2="478" stroke="#999" stroke-width="0.8"/>
    <text x="130" y="562" text-anchor="start" fill="#7a2020">페달 플레이트(인터록 B: 발로 밟아야 도징 가능)</text>
    <line x1="240" y1="550" x2="336" y2="493" stroke="#c66" stroke-width="0.8"/>
    <text x="120" y="648" text-anchor="start">이전 홀: 모래 기둥, 흰 점 = 다음 정렬 기준점</text>
    <line x1="250" y1="636" x2="298" y2="608" stroke="#999" stroke-width="0.8"/>
  </g>
  <g font-size="12.5" fill="#333">
    <!-- right column -->
    <text x="732" y="122" text-anchor="start">T-핸들 + 도징 레버(자전거 브레이크)</text>
    <text x="616" y="166" text-anchor="start">호퍼 5L (경첩 뚜껑+걸쇠)</text>
    <line x1="612" y1="162" x2="596" y2="158" stroke="#999" stroke-width="0.8"/>
    <text x="588" y="242" text-anchor="start">셀 휠 도저 Ø110, 2포켓</text>
    <text x="588" y="258" text-anchor="start">(피스톤 슬러그로 7~26cm³ 조절)</text>
    <line x1="584" y1="244" x2="570" y2="246" stroke="#999" stroke-width="0.8"/>
    <text x="600" y="318" text-anchor="start">마스트 25×25×1000mm</text>
    <line x1="596" y1="314" x2="571" y2="314" stroke="#999" stroke-width="0.8"/>
    <text x="560" y="356" text-anchor="start">슈트 40mm PVC, 60°</text>
    <text x="560" y="372" text-anchor="start">투명 점검창(도즈 확인)</text>
    <line x1="556" y1="352" x2="490" y2="344" stroke="#999" stroke-width="0.8"/>
    <text x="596" y="420" text-anchor="start">45° 디플렉터(HDPE)</text>
    <line x1="592" y1="416" x2="548" y2="442" stroke="#999" stroke-width="0.8"/>
    <text x="690" y="452" text-anchor="start">플러그 트레이 4L(탈착)</text>
    <line x1="686" y1="448" x2="666" y2="462" stroke="#999" stroke-width="0.8"/>
    <text x="452" y="398" text-anchor="start" fill="#6a4a24">플러그 배출 경로</text>
    <text x="452" y="414" text-anchor="start" fill="#6a4a24">(삽입 행정 때 창→디플렉터→트레이)</text>
    <text x="418" y="462" text-anchor="start" fill="#a3843e">모래 낙하(1클릭=계량 도즈)</text>
    <text x="430" y="648" text-anchor="start">새로 뚫은 홀 Ø16×90mm — 바닥부터 충전 중</text>
    <line x1="426" y1="636" x2="402" y2="606" stroke="#999" stroke-width="0.8"/>
    <text x="700" y="558" text-anchor="start">데크 300×200mm, 12mm 합판+알루미늄 스킨</text>
    <text x="700" y="574" text-anchor="start">가장자리 스키드로 밀어서 이동(들지 않음)</text>
    <line x1="696" y1="554" x2="590" y2="502" stroke="#999" stroke-width="0.8"/>
  </g>
</svg>
