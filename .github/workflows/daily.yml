name: dashboard-updates

# Dashboard refresh only. Independent morning-mail workflow owns all email.
on:
  schedule:
    - cron: '0 9 * * 1-5'
      timezone: America/Chicago
    - cron: '17 10-16 * * 1-5'
      timezone: America/Chicago
    - cron: '7 9 * * 0,6'
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued schedules may carry an old SHA containing an old mail marker.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard dependencies
        run: pip install yfinance pandas requests tzdata
      - name: Build dashboard
        run: python market_dashboard.py --no-publish -o index.html
      - name: Publish dashboard
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "auto update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push origin HEAD:main
          fi
