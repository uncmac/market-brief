name: dashboard-updates

# ── 스케줄 설계 메모 (2026-09-04 개편: 텍사스(중부) 오전 9시 발송) ──────────
# GitHub cron은 "정시 보장"이 아니라 최선 노력(best-effort)이라 45분~3시간 지연되거나
# 아예 배달되지 않는 날이 있다(8/31 하루 0건, 9/1~9/3은 첫 배달이 12:17 CT).
# 그래서 "한 번의 정확한 예약"에 기대지 않고 아래 3중 구조로 오전 발송을 확보한다.
#   1) 9시 조금 전(CT 8:47 등)에도 후보를 두고, 9시 전에 도착한 실행은 CT 8:56까지
#      기다렸다가 빌드 → 메일이 9시 정각에 나가게 한다.
#   2) 오전 내내(≈8:47~11:51 CT) 재시도 슬롯을 여러 개 두고 먼저 도착한 실행이
#      발송한다. .mail_sent 마커로 하루 1회만 발송되도록 보장한다.
#   3) SMTP 자체 실패는 send_mail.py 안에서 3회 재시도한다.
# 장중 시간별 갱신은 cron이 아니라 그날 첫 실행이 루프로 처리한다(cron 의존 최소화).
# cron은 UTC 고정이라 서머타임을 모름 → 각 줄에 DST 양쪽 후보를 넣고 게이트가 거른다.
# 정각(:00)은 전 세계 cron이 몰려 지연이 심하므로 일부러 어중간한 분에 배치한다.
on:
  schedule:
    - cron: '47 13,14 * * 1-5'   # CT 8:47/9:47(여름), 7:47/8:47(겨울) — 9시 정각 발송 본 슬롯
    - cron: '33 14,15 * * 1-5'   # CT 9:33/10:33(여름), 8:33/9:33(겨울) — 재시도
    - cron: '19 15,16 * * 1-5'   # CT 10:19/11:19(여름), 9:19/10:19(겨울) — 재시도
    - cron: '51 16,17 * * 1-5'   # CT 11:51/12:51(여름), 10:51/11:51(겨울) — 오전 마지막 재시도
    - cron: '15 20,21 * * 1-5'   # CT 3:15 PM (16:15 ET) — 마감 후 확정 종가 스냅샷
    - cron: '0 12 * * 0,6'       # 주말 아침 1회 (BTC·뉴스 갱신, 메일 없음)
  workflow_dispatch:
    inputs:
      send_mail:
        description: '메일도 발송할지'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355          # 9시 대기 + 장중 루프. GitHub 작업 상한 360분 이내
    steps:
      - uses: actions/checkout@v4

      - name: Gate (시간대·요일·중복 판정)
        id: gate
        run: |
          DOW=$(TZ=America/New_York date +%u)                 # 1=월 ... 7=일
          CT_H=$(TZ=America/Chicago date +%H); CT_M=$(TZ=America/Chicago date +%M)
          CT_NOW=$((10#$CT_H * 60 + 10#$CT_M))
          TODAY_CT=$(TZ=America/Chicago date +%F)
          MAILED=0
          if [ "$(cat .mail_sent 2>/dev/null)" = "$TODAY_CT" ]; then MAILED=1; fi
          RUN=false; MAIL=false; LOOP=false; WAIT=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true                                          # 수동 실행은 1회성 (루프 없음)
            if [ "${{ inputs.send_mail }}" = "true" ]; then MAIL=true; fi
          elif [ "$DOW" -ge 6 ]; then
            RUN=true                                          # 주말 갱신 (메일 없음)
          elif [ "$CT_NOW" -ge 450 ] && [ "$CT_NOW" -lt 780 ]; then
            # 평일 CT 7:30~12:59 = 그날의 발송·갱신 담당 구간
            if [ "$MAILED" = "1" ]; then
              echo "오늘(${TODAY_CT}) 발송 완료 → 중복 실행 생략"
            else
              RUN=true; LOOP=true; MAIL=true
              # 9시 전에 도착했으면 CT 8:56까지 대기 → 빌드(약 3~4분) 후 9시 정각 발송
              if [ "$CT_NOW" -lt 536 ]; then WAIT=$(( (536 - CT_NOW) * 60 )); fi
            fi
          elif [ "$CT_NOW" -ge 870 ] && [ "$CT_NOW" -lt 1020 ]; then
            RUN=true                                          # CT 14:30~16:59 마감 스냅샷
          fi
          DEADLINE=$(( $(date +%s) + 20100 ))                 # 이 작업의 절대 종료 기한(335분)
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mail=$MAIL" >> "$GITHUB_OUTPUT"
          echo "loop=$LOOP" >> "$GITHUB_OUTPUT"
          echo "wait=$WAIT" >> "$GITHUB_OUTPUT"
          echo "deadline=$DEADLINE" >> "$GITHUB_OUTPUT"
          echo "today_ct=$TODAY_CT" >> "$GITHUB_OUTPUT"
          echo "gate: run=$RUN mail=$MAIL loop=$LOOP wait=${WAIT}s (CT $CT_H:$CT_M, DOW=$DOW, mailed_today=$MAILED)"

      - name: Wait for 9:00 AM Central
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.wait != '0'
        run: |
          echo "9시 전 도착 → CT 8:56까지 ${{ steps.gate.outputs.wait }}초 대기 (9시 정각 발송용)"
          sleep ${{ steps.gate.outputs.wait }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install yfinance pandas requests tzdata

      - name: Build dashboard
        if: steps.gate.outputs.run == 'true'
        run: python market_dashboard.py -o index.html

      - name: Holiday check
        id: holiday
        if: steps.gate.outputs.run == 'true'
        run: |
          # 평일 휴장일(공휴일)이면 대시보드에 '휴장일 →' 문구가 생김 → 갱신·메일 모두 생략
          # (주말 문구 '주말 휴장 →'과 데이터 지연 문구 '데이터 지연 →'은 여기 걸리지 않음)
          if grep -q '휴장일 →' index.html; then CLOSED=true; else CLOSED=false; fi
          echo "closed=$CLOSED" >> "$GITHUB_OUTPUT"
          echo "holiday: $CLOSED"

      - name: Commit & push if changed
        if: steps.gate.outputs.run == 'true' && steps.holiday.outputs.closed != 'true'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "auto update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs
          git push

      - name: Send email notification
        if: steps.gate.outputs.mail == 'true' && steps.holiday.outputs.closed != 'true'
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_mail.py

      - name: Record mail marker
        if: steps.gate.outputs.mail == 'true' && steps.holiday.outputs.closed != 'true'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          echo "${{ steps.gate.outputs.today_ct }}" > .mail_sent
          git add .mail_sent
          git diff --cached --quiet || {
            git commit -m "mail sent ${{ steps.gate.outputs.today_ct }}"
            git pull --rebase -X theirs
            git push
          }

      - name: Intraday refresh loop (매시 30분, CT 14:30까지)
        if: steps.gate.outputs.loop == 'true' && steps.holiday.outputs.closed != 'true'
        run: |
          # cron 배달에 의존하지 않고 이 실행 하나가 장중 시간별 갱신을 모두 담당한다.
          # set -e 때문에 조건 분기는 반드시 if/then/fi 로 쓴다 ( [ ] && cmd 는 종료 유발 )
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          while true; do
            H=$(TZ=America/Chicago date +%-H); M=$(TZ=America/Chicago date +%-M)
            if [ "$M" -lt 30 ]; then
              WAIT=$(( (30 - M) * 60 )); NEXT=$(( H * 100 + 30 ))
            else
              WAIT=$(( (90 - M) * 60 )); NEXT=$(( (H + 1) * 100 + 30 ))
            fi
            if [ "$NEXT" -gt 1430 ]; then
              echo "장중 갱신 종료 (다음 슬롯 CT $NEXT 는 마감 이후)"
              break
            fi
            if [ "$(date +%s)" -gt "${{ steps.gate.outputs.deadline }}" ]; then
              echo "장중 갱신 종료 (작업 시간 상한 도달 — 6시간 한도 보호)"
              break
            fi
            echo "다음 갱신 CT $NEXT 까지 ${WAIT}초 대기"
            sleep "$WAIT"
            if ! python market_dashboard.py -o index.html; then
              echo "[경고] 갱신 실패 → 다음 슬롯에 재시도"
              continue
            fi
            if grep -q '휴장일 →' index.html; then
              echo "휴장일로 판정 → 루프 종료"
              break
            fi
            git add index.html
            git diff --cached --quiet || {
              git commit -m "auto update $(date -u +'%Y-%m-%d %H:%M UTC')"
              git pull --rebase -X theirs
              git push
            }
          done
